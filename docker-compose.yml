services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: predict-lotto-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-predict_lotto_nz}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - predict-lotto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-predict_lotto_nz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # .NET Core Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: predict-lotto-backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-predict_lotto_nz};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password}"
      PredictorService__BaseUrl: ${PREDICTOR_SERVICE_URL:-http://predictor:8000}
      AWS__Region: ${AWS_REGION:-us-west-2}
      AWS__AccessKeyId: ${AWS_ACCESS_KEY_ID}
      AWS__SecretAccessKey: ${AWS_SECRET_ACCESS_KEY}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
    ports:
      - "${BACKEND_PORT:-5000}:80"
    depends_on:
      postgres:
        condition: service_healthy
      predictor:
        condition: service_started
    networks:
      - predict-lotto-network
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Vue.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_BASE_URL: ${VUE_APP_API_BASE_URL:-http://localhost:5000}
    container_name: predict-lotto-frontend
    environment:
      VUE_APP_API_BASE_URL: ${VUE_APP_API_BASE_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - predict-lotto-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Python FastAPI Predictor Service
  predictor:
    build:
      context: ./predictor
      dockerfile: Dockerfile
    container_name: predict-lotto-predictor
    environment:
      PYTHONPATH: /app
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MODEL_PATH: ${MODEL_PATH:-/app/models}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${PREDICTOR_PORT:-8000}:8000"
    networks:
      - predict-lotto-network
    volumes:
      - predictor_models:/app/models
      - predictor_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  predict-lotto-network:
    driver: bridge
    name: predict-lotto-network

volumes:
  postgres_data:
    driver: local
    name: predict-lotto-postgres-data
  predictor_models:
    driver: local
    name: predict-lotto-predictor-models
  predictor_data:
    driver: local
    name: predict-lotto-predictor-data